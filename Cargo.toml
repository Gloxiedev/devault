[package]
name = "devault"
version = "0.1.0"
edition = "2024"
description = "Local credential vault and agent access layer for developers and AI coding agents"
license = "MIT"
repository = "https://github.com/devault/devault"
readme = "README.md"
categories = ["command-line-utilities", "cryptography", "security"]
keywords = ["credentials", "vault", "secrets", "ssh", "git", "agent"]

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
console = "0.15"
dialoguer = "0.11"
indicatif = "0.17"

# Cryptography
argon2 = "0.5"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand = { version = "0.8", features = ["std", "getrandom"] }
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.5"
sha2 = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json"] }

# Async runtime
tokio = { version = "1.40", features = ["full", "macros"] }

# IPC
tokio-serde = { version = "0.7", features = ["json"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
futures = "0.3"

# SSH
ssh2 = "0.9"
russh = "0.50"
russh-keys = "0.50.0-beta.7"

# Git
git2 = "0.19"

# System
dirs = "5.0"
which = "5.0"
nix = { version = "0.28", features = ["process", "socket", "user"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde", "fast-rng"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hex = "0.4"
base64 = "0.22"

# Completion
clap_complete = "4.5"

[dev-dependencies]
tempfile = "3.10"
proptest = "1.4"
serial_test = "3.0"

[[bin]]
name = "devault"
path = "src/main.rs"

[[bin]]
name = "devaultd"
path = "src/daemon/main.rs"